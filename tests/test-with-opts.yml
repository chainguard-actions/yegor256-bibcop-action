name: Test with opts input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Remove all existing bib files and create a known-valid one
        run: |
          find "$GITHUB_WORKSPACE" -name '*.bib' -delete
          echo "@misc{x, title={{Hello, World!}}, author={Bugayenko, Yegor}, year={2024}}" > "$GITHUB_WORKSPACE/test.bib"
          echo "Created test.bib:"
          cat "$GITHUB_WORKSPACE/test.bib"

      - name: Run bibcop action with --verbose opts
        id: action
        uses: .
        with:
          opts: '--verbose'

      - name: Assert action succeeded with opts
        run: |
          echo "PASS: action completed successfully with --verbose opts"

name: Test basic usage with no bib files (succeeds)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Remove any bib files from workspace to ensure clean state
        run: find "$GITHUB_WORKSPACE" -name '*.bib' -delete
      - id: action
        uses: .
        with:
          opts: ''
      - name: Assert action succeeded
        run: |
          echo "Action completed successfully with no .bib files"
          echo "PASS"

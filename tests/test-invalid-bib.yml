name: Test with invalid bib file (action should fail)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Remove any existing bib files from workspace
        run: find "$GITHUB_WORKSPACE" -name '*.bib' -delete
      - name: Create an invalid bib file missing required fields
        run: |
          cat > "$GITHUB_WORKSPACE/bad.bib" << 'EOF'
          @article{badentry,
            title = {A Paper Without Author or Journal},
          }
          EOF
      - name: Run action and expect failure
        id: action
        uses: .
        with:
          opts: ''
        continue-on-error: true
      - name: Assert action failed on invalid bib
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail on invalid bib file, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed on invalid bib file"

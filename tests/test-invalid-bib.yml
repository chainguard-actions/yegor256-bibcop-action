---
name: Test invalid bib file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Remove any existing .bib files from workspace
        run: find "$GITHUB_WORKSPACE" -name '*.bib' -delete
      - name: Create an invalid .bib file
        run: |
          printf '@article{badentry,\n  title = {A Paper Without Required Fields},\n}\n' \
            > "$GITHUB_WORKSPACE/bad-refs.bib"
          echo "Created bad-refs.bib:"
          cat "$GITHUB_WORKSPACE/bad-refs.bib"
      - name: Run bibcop action on invalid bib file (expect failure)
        id: action
        uses: .
        continue-on-error: true
      - name: Assert action failed on invalid bib file
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: bibcop correctly detected errors in invalid .bib file"
          else
            echo "FAIL: expected bibcop to fail on invalid .bib file, but outcome was: $OUTCOME"
            exit 1
          fi

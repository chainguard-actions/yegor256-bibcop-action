name: Test with invalid bib file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a bib file with issues
        run: |
          cat > "$GITHUB_WORKSPACE/bad.bib" << 'EOF'
          @article{bad2024,
            title = {some title without proper capitalization},
            author = {John Smith},
            year = {2024},
          }
          EOF
      - id: action
        uses: .
        continue-on-error: true
      - name: Assert action ran (bibcop should detect issues)
        run: |
          echo "bibcop ran against the bib file"
          echo "PASS"

---
name: Test invalid bib file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up invalid bib file only
        run: |
          # Remove all existing .bib files (including fixtures)
          find . -name '*.bib' -delete
          # Create an invalid bib file (missing required fields: author, year)
          printf '@article{badentry,\n  title = {A Paper Without Author or Journal},\n}\n' > broken.bib
          echo "Created broken.bib:"
          cat broken.bib
          echo "All .bib files in workspace:"
          find . -name '*.bib'
      - name: Run bibcop action on invalid bib file (expect failure)
        id: action
        uses: .
        continue-on-error: true
      - name: Assert action failed on invalid bib file
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed on invalid .bib file"
          else
            echo "FAIL: expected action to fail on invalid .bib file, but got outcome: $OUTCOME"
            exit 1
          fi

---
name: Test opts input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Remove any existing .bib files from workspace
        run: find "$GITHUB_WORKSPACE" -name '*.bib' -delete
      - name: Create a valid .bib file
        run: |
          printf '@misc{sample2024,\n  title={{Hello, World!}},\n  author={Bugayenko, Yegor},\n  year={2024}\n}\n' \
            > "$GITHUB_WORKSPACE/sample.bib"
          echo "Created sample.bib:"
          cat "$GITHUB_WORKSPACE/sample.bib"
      - name: Run bibcop action with opts input (empty string)
        id: action
        uses: .
        with:
          opts: ''
      - name: Assert action completed successfully with opts
        run: |
          echo "PASS: bibcop action completed with opts input provided"

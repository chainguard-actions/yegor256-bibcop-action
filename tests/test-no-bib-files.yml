---
name: Test no bib files
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Remove any .bib files that might exist
        run: |
          find "$GITHUB_WORKSPACE" -name '*.bib' -delete
          echo "Removed any existing .bib files"
          echo "Remaining .bib files: $(find "$GITHUB_WORKSPACE" -name '*.bib' | wc -l)"
      - name: Run bibcop action with no .bib files
        id: action
        uses: .
      - name: Assert action completed successfully with no bib files
        run: |
          echo "PASS: action completed without error when no .bib files present"

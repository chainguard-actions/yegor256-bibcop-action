name: Test graceful exit when no bib files present
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Remove all .bib files from workspace
        run: |
          find "$GITHUB_WORKSPACE" -name '*.bib' -delete
          remaining=$(find "$GITHUB_WORKSPACE" -name '*.bib' | wc -l)
          echo "Remaining .bib files: $remaining"
      - id: action
        uses: .
      - name: Assert action completed without error
        run: |
          echo "PASS: action exited gracefully when no .bib files were found"

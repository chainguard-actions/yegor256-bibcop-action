name: Test valid bib file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Verify fixture bib file exists
        run: |
          if [ ! -f tests/fixtures/valid.bib ]; then
            echo "FAIL: fixture file tests/fixtures/valid.bib not found"
            exit 1
          fi
          echo "Fixture file found:"
          cat tests/fixtures/valid.bib
      - name: Run bibcop action on valid bib file
        id: action
        uses: .
      - name: Assert action succeeded
        run: |
          echo "PASS: action completed successfully on valid .bib file"
